# fly.toml app configuration file generated for ifenkili on 2026-09-01T13:33:44+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ifenkili'
primary_region = 'jnb'

[build]
  dockerfile = 'Dockerfile'

[env]
  INBOX_DIR = '/data'
  NEXT_PUBLIC_SITE_URL = 'https://ifenkili.xyz'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
